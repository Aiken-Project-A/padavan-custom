name: Build Padavan Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'tl_c2-v1.config'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PADAVAN_DIR: /opt/padavan-ng

    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bison build-essential cmake cpio curl \
            fakeroot flex gawk gettext git gperf help2man kmod libblkid-dev \
            libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev \
            libevent-dev libgmp-dev libgpg-error-dev libjansson-dev libjson-c-dev \
            libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libssl-dev libtool libtool-bin libudev-dev libxml2-dev locales mtr nano \
            pkg-config ppp-dev python3 python3-docutils texinfo unzip uuid \
            uuid-dev uuid-runtime wget xxd zlib1g-dev

      - name: Clone padavan-ng source
        run: |
          git clone --depth=1 https://gitlab.com/hadzhioglu/padavan-ng.git $PADAVAN_DIR

      - name: Apply custom config
        run: |
          cp tl_c2-v1.config $PADAVAN_DIR/trunk/.config

      - name: Build toolchain
        working-directory: /opt/padavan-ng/toolchain
        run: |
          ./clean_sources.sh
          ./build_toolchain.sh

      - name: Build firmware
        working-directory: /opt/padavan-ng/trunk
        run: |
          # Ensure cross-compiler is in PATH
          export PATH="$PADAVAN_DIR/toolchain/out/bin:$PATH"
          # Ubuntu 22.04 uses GCC by default, no clang override needed
          # Verify cross-compiler exists
          which mipsel-linux-uclibc-gcc && mipsel-linux-uclibc-gcc --version | head -1
          echo "Host CC: $(which gcc) $(gcc --version | head -1)"
          # Build
          ./clear_tree.sh
          ./build_firmware.sh

      - name: Show firmware info
        if: success()
        run: |
          ls -la $PADAVAN_DIR/trunk/images/ 2>/dev/null
          echo "---"
          md5sum $PADAVAN_DIR/trunk/images/*.trx 2>/dev/null

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: padavan-TL_C2-V1-custom
          path: /opt/padavan-ng/trunk/images/*.trx
          retention-days: 30
